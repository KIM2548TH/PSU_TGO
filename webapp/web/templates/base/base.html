<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block title %}
    PSU-CFO
    {% endblock %}
  </title>
  <link rel="stylesheet" href="{{ 'css/app.css' | static_url }}">
  
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="{{ 'node_modules/htmx.org/dist/htmx.min.js' | static_url }}"></script>
  <script src="{{ 'node_modules/cally/dist/cally.js' | static_url }}"></script>
  <script src="{{ 'js/date-picker.js' | static_url }}"></script>
  <script src="{{ 'js/toast.js' | static_url }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- เพิ่มใน head section -->
  {% block head %}
  {% endblock head %}
</head>

<body>
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar Toggle -->
    <input id="sidebar-toggle" type="checkbox" class="hidden peer" />

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar fixed top-0 left-0 h-full bg-base-200 shadow-md z-20">
      {% include "base/sidebar.html" %}
    </div>

    <!-- Main Content -->
    <div id="main-content" class="ml-64 flex-1 flex flex-col peer-checked:ml-0">
      <!-- Navbar -->
      <div class="z-1 w-full bg-base-100">
        {% include "base/navbar.html" %}
      </div>
      
      <!-- Scrollable Body -->
      <div class="p-2 flex-grow bg-base-200 z-0 overflow-y-auto">
        {% block body %}
        {% endblock body %}
      </div>
    </div>
  </div>
    <!-- Modal -->
    <div id="modal" class="modal">
      <div id="modal-content" class="modal-box w-full max-w-none">
        <!-- เนื้อหาจะถูกโหลดที่นี่ -->
      </div>
    </div>
    <!-- Feather Replace Script -->
    <script>
    // Zoom functionality
    let currentZoom = 1;
    const zoomStep = 0.1;
    const minZoom = 0.5;
    const maxZoom = 2;

    function zoomIn() {
      if (currentZoom < maxZoom) {
        currentZoom += zoomStep;
        applyZoom();
      }
    }

    function zoomOut() {
      if (currentZoom > minZoom) {
        currentZoom -= zoomStep;
        applyZoom();
      }
    }

    function resetZoom() {
      currentZoom = 1;
      applyZoom();
    }

    function applyZoom() {
      // ใช้ transform scale แทน zoom เพื่อให้ตัวอักษรขยายจริง
      document.body.style.transform = `scale(${currentZoom})`;
      document.body.style.transformOrigin = 'top left';
      
      // คำนวณความกว้างและความสูงของ viewport หลังจาก scale
      const scaledWidth = window.innerWidth / currentZoom;
      const scaledHeight = window.innerHeight / currentZoom;
      
      // ปรับขนาด body ให้พอดีกับ scale
      document.body.style.width = scaledWidth + 'px';
      document.body.style.height = scaledHeight + 'px';
      
      // คำนวณความกว้างของ sidebar และ margin ของ main content ตาม zoom
      const baseSidebarWidth = 256; // 16rem * 16px = 256px (w-64)
      const newSidebarWidth = baseSidebarWidth;
      
      // ปรับความกว้างของ sidebar (ไม่ต้องคูณ currentZoom เพราะ scale จัดการให้แล้ว)
      const sidebar = document.getElementById('sidebar');
      if (sidebar) {
        sidebar.style.width = newSidebarWidth + 'px';
      }
      
      // ปรับ margin-left ของ main content ขึ้นกับสถานะ sidebar-toggle
      const mainContent = document.getElementById('main-content');
      if (mainContent) {
        const sidebarToggle = document.getElementById('sidebar-toggle');
        // ถ้าไม่มี checkbox ให้ถือว่า sidebar เปิดอยู่
        const sidebarOpen = sidebarToggle ? !sidebarToggle.checked : true;
        mainContent.style.marginLeft = sidebarOpen ? (newSidebarWidth + 'px') : '0px';
      }
      
      // บันทึกค่า zoom ใน localStorage
      localStorage.setItem('pageZoom', currentZoom);
    }

    // โหลดค่า zoom ที่บันทึกไว้
    function loadSavedZoom() {
      const savedZoom = localStorage.getItem('pageZoom');
      if (savedZoom) {
        currentZoom = parseFloat(savedZoom);
        applyZoom();
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      // โหลดค่า zoom ที่บันทึกไว้
      loadSavedZoom();

      // ติด listener ให้อัพเดตเมื่อ toggle sidebar
      const sidebarToggle = document.getElementById('sidebar-toggle');
      if (sidebarToggle) {
        sidebarToggle.addEventListener('change', applyZoom);
      }
      
      // ป้องกันการใช้คีย์ลัดซูมของเบราว์เซอร์
      document.addEventListener('keydown', function(e) {
        // ตรวจจับ Ctrl+Plus, Ctrl+Minus, Ctrl+0 (Windows/Linux)
        // และ Cmd+Plus, Cmd+Minus, Cmd+0 (Mac)
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '=' || e.key === '-' || e.key === '0')) {
          e.preventDefault();
          
          // เรียกฟังก์ชันซูมของเราแทน
          if (e.key === '+' || e.key === '=') {
            zoomIn();
          } else if (e.key === '-') {
            zoomOut();
          } else if (e.key === '0') {
            resetZoom();
          }
        }
      });
      
      // เรียก feather.replace() เมื่อโหลดหน้าครั้งแรก
      if (typeof feather !== 'undefined') {
        feather.replace();
      }
      
      // ใช้ event listener เดียวสำหรับ HTMX events
      document.addEventListener('htmx:afterSwap', function(e) {
        // เรียก feather.replace() เฉพาะเมื่อจำเป็น
        setTimeout(() => {
          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        }, 50);
      });
      
      // HTMX Event Listener สำหรับ Toast Notifications (ใช้ตัวเดียว)
      document.addEventListener('htmx:afterRequest', function(event) {
        const xhr = event.detail.xhr;
        
        // ตรวจสอบ HX-Trigger headers จาก server
        const hxTrigger = xhr.getResponseHeader('HX-Trigger');
        if (hxTrigger) {
          try {
            const triggers = JSON.parse(hxTrigger);
            
            // แสดง success toast
            if (triggers.showSuccess) {
              const message = decodeURIComponent(triggers.showSuccess);
              showSuccess(message);
            }
            
            // แสดง error toast
            if (triggers.showError) {
              const message = decodeURIComponent(triggers.showError);
              showError(message);
            }
            
            // แสดง warning toast
            if (triggers.showWarning) {
              const message = decodeURIComponent(triggers.showWarning);
              showWarning(message);
            }
            
            // แสดง info toast
            if (triggers.showInfo) {
              const message = decodeURIComponent(triggers.showInfo);
              showInfo(message);
            }
            
            // ปิด modal
            if (triggers.closeModal) {
              const modal = document.getElementById('modal');
              if (modal) {
                modal.checked = false;
                modal.classList.remove('modal-open');
              }
            }
          } catch (e) {
            console.log('Could not parse HX-Trigger header:', e);
          }
        }
      });
    });
    </script>
  
  {% block js %}
  {% endblock js %}
</body>

</html>
