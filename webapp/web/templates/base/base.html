<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% block title %}
    PSU-CFO
    {% endblock %}
  </title>
  <link rel="stylesheet" href="{{ 'css/app.css' | static_url }}">
  
  <script src="https://unpkg.com/feather-icons"></script>
  <script src="{{ 'node_modules/htmx.org/dist/htmx.min.js' | static_url }}"></script>
  <script src="{{ 'node_modules/cally/dist/cally.js' | static_url }}"></script>
  <script src="{{ 'js/date-picker.js' | static_url }}"></script>
  <script src="{{ 'js/toast.js' | static_url }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  
  <!-- เพิ่มใน head section -->
  {% block head %}
  {% endblock head %}
</head>

<body>
  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar Toggle -->
    <input id="sidebar-toggle" type="checkbox" class="hidden peer" />

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar fixed top-0 left-0 h-full bg-base-200 shadow-md z-20">
      {% include "base/sidebar.html" %}
    </div>

    <!-- Main Content -->
    <div id="main-content" class="ml-64 flex-1 flex flex-col peer-checked:ml-0">
      <!-- Navbar -->
      <div class="z-1 w-full bg-base-100">
        {% include "base/navbar.html" %}
      </div>
      
      <!-- Scrollable Body -->
      <div class="p-2 flex-grow bg-base-200 z-0 overflow-y-auto">
        {% block body %}
        {% endblock body %}
      </div>
    </div>
  </div>
    <!-- Modal -->
    <div id="modal" class="modal">
      <div id="modal-content" class="modal-box w-full max-w-none">
        <!-- เนื้อหาจะถูกโหลดที่นี่ -->
      </div>
    </div>
    <!-- Feather Replace Script -->
    <script>
    document.addEventListener('DOMContentLoaded', function() {
      // เรียก feather.replace() เมื่อโหลดหน้าครั้งแรก
      if (typeof feather !== 'undefined') {
        feather.replace();
      }
      
      // ใช้ event listener เดียวสำหรับ HTMX events
      document.addEventListener('htmx:afterSwap', function(e) {
        // เรียก feather.replace() เฉพาะเมื่อจำเป็น
        setTimeout(() => {
          if (typeof feather !== 'undefined') {
            feather.replace();
          }
        }, 50);
      });
      
      // HTMX Event Listener สำหรับ Toast Notifications (ใช้ตัวเดียว)
      document.addEventListener('htmx:afterRequest', function(event) {
        const xhr = event.detail.xhr;
        
        // ตรวจสอบ HX-Trigger headers จาก server
        const hxTrigger = xhr.getResponseHeader('HX-Trigger');
        if (hxTrigger) {
          try {
            const triggers = JSON.parse(hxTrigger);
            
            // แสดง success toast
            if (triggers.showSuccess) {
              const message = decodeURIComponent(triggers.showSuccess);
              showSuccess(message);
            }
            
            // แสดง error toast
            if (triggers.showError) {
              const message = decodeURIComponent(triggers.showError);
              showError(message);
            }
            
            // แสดง warning toast
            if (triggers.showWarning) {
              const message = decodeURIComponent(triggers.showWarning);
              showWarning(message);
            }
            
            // แสดง info toast
            if (triggers.showInfo) {
              const message = decodeURIComponent(triggers.showInfo);
              showInfo(message);
            }
            
            // ปิด modal
            if (triggers.closeModal) {
              const modal = document.getElementById('modal');
              if (modal) {
                modal.checked = false;
                modal.classList.remove('modal-open');
              }
            }
          } catch (e) {
            console.log('Could not parse HX-Trigger header:', e);
          }
        }
      });
    });
    </script>
  
  {% block js %}
  {% endblock js %}
</body>

</html>
