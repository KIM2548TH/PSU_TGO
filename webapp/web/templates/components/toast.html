<!-- Simple Toast Container - JavaScript functions are now global in toast.js -->
<div id="toast-container" class="fixed top-4 right-4 z-50 space-y-2">
  <!-- Toast messages จะถูกเพิ่มที่นี่โดย JavaScript -->
</div>

<!-- 
การใช้งาน Toast Notifications (ใช้ได้ทุกหน้า):

1. แสดง toast แบบง่าย:
   showSuccess('บันทึกข้อมูลสำเร็จ!');
   showError('เกิดข้อผิดพลาด!');
   showWarning('คำเตือน!');
   showInfo('ข้อมูลทั่วไป');

2. แสดง toast พร้อมกำหนดเวลา:
   showSuccess('สำเร็จ!', 5000); // แสดง 5 วินาที
   showError('ผิดพลาด!', 0);    // แสดงตลอดจนกว่าจะปิด

3. ซ่อน toast ทั้งหมด:
   hideAllToasts();

4. ซ่อน toast เฉพาะ:
   const toastId = showSuccess('ข้อความ');
   hideToast(toastId);

ไม่ต้องเขียน JavaScript เพิ่มเติม - ใช้ได้เลย!
-->
