<div class="flex justify-between items-center mb-4">
  <h2 class="text-lg font-bold">{{ t.edit_role }}</h2>
  <button type="button" class="btn btn-sm btn-circle btn-ghost hover:bg-gray-200" 
          onclick="document.getElementById('modal').classList.remove('modal-open')">
    <i data-feather="x" class="w-4 h-4"></i>
  </button>
</div>

<form hx-post="{{ url_for('role_management.edit_role', role_id=role.id) }}"
      hx-target="#modal-content"
      hx-swap="innerHTML">

  <div class="mb-2">
    <label class="block text-sm font-medium">{{ t.name }}</label>
    <input type="text" name="name" value="{{ role.name }}" class="input input-bordered w-full" required>
  </div>
  <div class="mb-2">
    <label class="block text-sm font-medium">{{ t.description }}</label>
    <textarea name="description" class="textarea textarea-bordered w-full">{{ role.description }}</textarea>
  </div>
  <div class="mb-2">
    <label class="block text-sm font-medium">ลำดับขั้น/ยศ (เลขน้อย = ยศสูง)</label>
    <input type="number" name="rank" class="input input-bordered w-full" min="1" value="{{ role.rank or 1 }}" required>
  </div>
    <div class="mb-2">
      <label class="block text-sm font-medium">Scope Type (ขอบเขตการมองเห็น)</label>
      <select name="scope_type" class="select select-bordered w-full">
        <option value="global" {% if role.scope_type == 'global' %}selected{% endif %}>Global (เห็นทุกคน)</option>
        <option value="campus" {% if role.scope_type == 'campus' %}selected{% endif %}>Campus (เห็นเฉพาะวิทยาเขตเดียวกัน)</option>
        <option value="department" {% if role.scope_type == 'department' %}selected{% endif %}>Department (เห็นเฉพาะคณะเดียวกัน)</option>
      </select>
    </div>

  <div class="mb-4">
    <label class="block text-sm font-medium mb-1">{{ t.permissions }}</label>
    <div class="grid grid-cols-2 gap-4 max-h-40 overflow-y-auto">
      {% for perm in permissions %}
        <div class="flex items-center space-x-2 relative">
          <input type="checkbox"
                 name="permissions"
                 value="{{ perm.id }}"
                 id="perm-{{ perm.id }}"
                 class="checkbox checkbox-primary rounded-full"
                 {% if perm.id in selected_permission_ids %}checked{% endif %}
                 title="{{ perm.description }}">
          <label for="perm-{{ perm.id }}" class="text-sm">
            {{ perm.name | capitalize }}
          </label>
        </div>
      {% endfor %}
    </div>
  </div>

  {% if error_msg %}
  <p class="text-red-500 text-sm mb-2">{{ error_msg }}</p>
  {% endif %}

  <div class="flex justify-end space-x-2">
    <button type="button" class="btn"
            onclick="document.getElementById('modal').classList.remove('modal-open')">{{ t.cancel }}</button>
    <button type="submit" class="btn btn-primary">{{ t.save }}</button>
  </div>
</form>
