<!-- Download PDF Modal Fragment สำหรับ HTMX -->
<div class="modal modal-open" id="download-pdf-modal">
  <div class="modal-box w-11/12 max-w-md">
    <div class="flex justify-between items-center mb-4">
      <h3 class="font-bold text-lg">ดาวน์โหลด PDF</h3>
      <button class="btn btn-sm btn-circle btn-ghost" onclick="document.getElementById('download-pdf-modal').remove()">✕</button>
    </div>
    
    <form hx-post="{{ url_for('proportions.download_pdf') }}" 
          hx-target="#pdf-download-result" 
          hx-swap="innerHTML"
          hx-indicator="#pdf-loading"
          hx-on::after-request="if(event.detail.successful) { setTimeout(() => document.getElementById('download-pdf-modal').remove(), 2000); }">
      <input type="hidden" name="htmx_request" value="1">
      <div class="space-y-4">
        <!-- ปีที่เลือก (hidden) -->
        <input type="hidden" name="year" value="{{ selected_year }}">
        
        <!-- ชื่อรายงาน -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">ชื่อรายงาน</label>
          <input type="text" name="report_title" 
                 class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                 value="รายงานสัดส่วนการปล่อยก๊าซเรือนกระจก ปี {{ selected_year }}"
                 placeholder="ป้อนชื่อรายงาน">
        </div>
        
        <!-- หมายเหตุ -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">หมายเหตุ (ไม่บังคับ)</label>
          <textarea name="notes" rows="3" 
                    class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="เพิ่มหมายเหตุหรือข้อมูลเพิ่มเติม..."></textarea>
        </div>
        
        <!-- รูปแบบ PDF -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">รูปแบบการแสดงผล</label>
          <select name="pdf_format" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
            <option value="detailed">แสดงรายละเอียดทั้งหมด</option>
            <option value="summary">สรุปตาม Scope เท่านั้น</option>
          </select>
        </div>
      </div>
      
      <!-- Loading Indicator -->
      <div id="pdf-loading" class="hidden text-center py-4">
        <div class="inline-flex items-center">
          <div class="animate-spin rounded-full h-5 w-5 border-b-2 border-blue-500 mr-2"></div>
          <span class="text-gray-600">กำลังสร้าง PDF...</span>
        </div>
      </div>
      
      <!-- Result Area -->
      <div id="pdf-download-result" class="mt-4"></div>
      
      <!-- Result Area -->
      <div id="pdf-download-result" class="mt-4"></div>
      
      <!-- Buttons -->
      <div class="modal-action">
        <button type="button" class="btn btn-ghost" onclick="document.getElementById('download-pdf-modal').remove()">ยกเลิก</button>
        <button type="submit" class="btn btn-primary flex items-center">
          <i data-feather="download" class="w-4 h-4 mr-1"></i>
          สร้าง PDF
        </button>
      </div>
    </form>
  </div>
</div>
