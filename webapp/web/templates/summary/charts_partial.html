<!-- 
  NOTE: This entire block of code should be in your partial file 
  that is loaded by HTMX (e.g., /summary/charts_partial.html)
-->
<div id="charts-container">
  <div class="grid grid-cols-3 gap-6">
    
    <!-- Emissions Over Time Card - ใช้ 2 columns -->
    <div class="dashboard-card flex flex-col p-6 bg-white shadow-lg rounded-xl overflow-hidden col-span-2">
      <div class="flex justify-between items-center mb-4 flex-shrink-0">
        <h3 class="text-lg font-semibold text-gray-800">{{ t.emissions_over_time }}</h3>
        
        <!-- Time Range Filter Buttons -->
        <div class="flex gap-1 bg-gray-100 rounded-lg p-1">
          <button 
            class="time-filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-200 {% if chart_time_range == '1Y' or not chart_time_range %}active{% endif %}"
            data-range="1Y"
            hx-post="/summary/charts"
            hx-target="#charts-container"
            hx-swap="outerHTML"
            hx-include="[name='selected_scopes'],[name='selected_sub_scopes'],[name='time_period'],#hidden-selected-year"
            hx-vals='{"chart_time_range": "1Y"}'
          >1 Year</button>
          <button 
            class="time-filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-200 {% if chart_time_range == '5Y' %}active{% endif %}"
            data-range="5Y"
            hx-post="/summary/charts"
            hx-target="#charts-container"
            hx-swap="outerHTML"
            hx-include="[name='selected_scopes'],[name='selected_sub_scopes'],[name='time_period'],#hidden-selected-year"
            hx-vals='{"chart_time_range": "5Y"}'
          >5 Years</button>
          <button 
            class="time-filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-200 {% if chart_time_range == '10Y' %}active{% endif %}"
            data-range="10Y"
            hx-post="/summary/charts"
            hx-target="#charts-container"
            hx-swap="outerHTML"
            hx-include="[name='selected_scopes'],[name='selected_sub_scopes'],[name='time_period'],#hidden-selected-year"
            hx-vals='{"chart_time_range": "10Y"}'
          >10 Years</button>
          <button 
            class="time-filter-btn px-3 py-1.5 text-xs font-medium rounded-md transition-all duration-200 {% if chart_time_range == 'ALL' %}active{% endif %}"
            data-range="ALL"
            hx-post="/summary/charts"
            hx-target="#charts-container"
            hx-swap="outerHTML"
            hx-include="[name='selected_scopes'],[name='selected_sub_scopes'],[name='time_period'],#hidden-selected-year"
            hx-vals='{"chart_time_range": "ALL"}'
          >All Years</button>
        </div>
      </div>
      <div class="relative flex-grow chart-wrapper" style="height: 350px;">
        <canvas id="emissionsOverTimeChart"></canvas>
      </div>
    </div>

    <!-- Category Breakdown Card - ใช้ 1 column -->
    <div class="dashboard-card flex flex-col p-6 bg-white shadow-lg rounded-xl overflow-hidden col-span-1">
      <h3 class="text-lg font-semibold text-gray-800 mb-4 flex-shrink-0">{{ t.category_breakdown }}</h3>
      <div class="relative w-full mx-auto my-4 flex-shrink-0 chart-wrapper" style="height: 220px; max-width: 220px;">
        <canvas id="categoryBreakdownChart"></canvas>
      </div>
      <div id="category-legend" class="flex-grow overflow-y-auto min-h-0 space-y-4 pr-2 max-h-[200px]"></div>
    </div>

  </div>

  <style>
    /* Chart wrapper styles */
    .chart-wrapper {
      position: relative;
      width: 100%;
    }
    
    .chart-wrapper canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    
    /* Remove any transform or positioning that might affect Chart.js event handling */
    #emissionsOverTimeChart,
    #categoryBreakdownChart {
      position: relative;
    }

    /* Time Filter Button Styles */
    .time-filter-btn {
      color: #6b7280;
      background: transparent;
      cursor: pointer;
      border: none;
      outline: none;
    }
    
    .time-filter-btn:hover {
      color: #374151;
      background: rgba(0, 0, 0, 0.05);
    }
    
    .time-filter-btn.active {
      color: white;
      background: #3b82f6;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
  </style>

  <script>
    // ===== EXTREME CHART CLEANUP SYSTEM =====
    
    // Force destroy ALL chart instances aggressively
    function destroyAllChartsAggressively() {
      // Destroy only chart instances, do not remove canvas
      ['emissionsOverTimeChart', 'categoryBreakdownChart'].forEach(chartName => {
        if (window[chartName]) {
          try {
            window[chartName].destroy();
            delete window[chartName];
          } catch (e) {
            console.warn(`Error destroying ${chartName}:`, e);
          }
        }
      });
    }

    // HTMX Event Listeners
    document.addEventListener('htmx:beforeSwap', function(evt) {
      if (evt.detail.target && evt.detail.target.id === 'charts-container') {
        destroyAllChartsAggressively();
      }
    });

    // Ensure canvas is properly sized after HTMX swap
    document.addEventListener('htmx:afterSettle', function(evt) {
      if (evt.detail.target && evt.detail.target.id === 'charts-container') {
        // Force canvas to redraw with correct dimensions
        setTimeout(() => {
          ['emissionsOverTimeChart', 'categoryBreakdownChart'].forEach(chartName => {
            if (window[chartName]) {
              try {
                window[chartName].resize();
              } catch (e) {
                console.warn(`Error resizing ${chartName}:`, e);
              }
            }
          });
        }, 100);
      }
    });

    // Page unload cleanup
    window.addEventListener('beforeunload', function() {
      destroyAllChartsAggressively();
    });

    // ===== CHART INITIALIZATION =====
    
    (() => {
      // Initial aggressive cleanup
      destroyAllChartsAggressively();

      const doughnutCenterText = {
        id: 'doughnutCenterText',
        afterDraw: (chart) => {
          const opts = chart.config.options.plugins.doughnutCenterText;
          if (!opts || !opts.display) return;
          const { ctx, chartArea: { top, width, height } } = chart;
            ctx.save();
            ctx.font = `bold ${width / 5}px Inter, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#1f2937';
            ctx.fillText(opts.text, width / 2, height / 2 + top - 10);
            ctx.font = `normal ${width / 15}px Inter, sans-serif`;
            ctx.fillStyle = '#6b7280';
            ctx.fillText(opts.unit, width / 2, height / 2 + top + 20);
            ctx.restore();
        }
      };
      
      // Register plugin only once
      if (typeof Chart !== 'undefined') {
        try {
          if (!Chart.registry.plugins.get('doughnutCenterText')) {
            Chart.register(doughnutCenterText);
          }
        } catch (e) {
          console.warn('Plugin registration error:', e);
        }
      }

      function renderCustomLegend(labels, values, colors) {
        const el = document.getElementById('category-legend');
        if (!el) return;
        el.innerHTML = '';
        const total = values.reduce((a,v)=>a+v,0);
        const frag = document.createDocumentFragment();
        labels.forEach((label,i)=>{
          const value = values[i];
            const pct = total>0 ? (value/total)*100 : 0;
            const color = colors[i % colors.length];
            const div = document.createElement('div');
            div.innerHTML = `
              <div class="flex justify-between items-center mb-1.5 text-sm">
                <div class="flex items-center">
                  <span class="w-3 h-3 rounded-full mr-3 flex-shrink-0" style="background-color:${color};"></span>
                  <span class="text-gray-600">${label}</span>
                </div>
                <span class="font-medium text-gray-800">${value.toFixed(1)} (tonCO₂e)</span>
              </div>
              <div class="w-full bg-gray-200 rounded-full h-1.5">
                <div class="h-1.5 rounded-full" style="width:${pct}%;background-color:${color};"></div>
              </div>`;
            frag.appendChild(div);
        });
        el.appendChild(frag);
      }

      function renderCategoryBreakdownChart(labels, values, colors){
        console.log('🍩 Creating Category Breakdown Chart...');
        
        // Wait for canvas to be ready
        setTimeout(() => {
          const canvas = document.getElementById('categoryBreakdownChart');
          if (!canvas) {
            console.error('Canvas not found!');
            return;
          }
          
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            console.error('Context not available!');
            return;
          }
          
          try {
            const total = values.reduce((a,v)=>a+v,0);
            window.categoryBreakdownChart = new Chart(ctx, {
              type: 'doughnut',
              data: {
                labels,
                datasets: [{
                  data: values,
                  backgroundColor: colors,
                  borderColor: '#ffffff',
                  borderWidth: 4,
                  cutout: '75%',
                  offset: new Array(values.length).fill(0),
                  hoverOffset: 12
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                  duration: 900,
                  easing: 'easeOutQuart'
                },
                plugins: {
                  legend: { display: false },
                  tooltip: {
                    callbacks: {
                      label: (c) => {
                        const val = c.raw;
                        const pct = total > 0 ? ((val / total) * 100).toFixed(1) : 0;
                        return ` ${c.label}: ${pct}%`;
                      }
                    }
                  },
                  doughnutCenterText: { display: true, text: Math.round(total), unit: 'tonCO2' }
                },
                onClick: (evt, els, chart) => {
                  if (!els.length) return;
                  const { datasetIndex, index } = els[0];
                  const ds = chart.data.datasets[datasetIndex];
                  const cur = ds.offset[index];
                  ds.offset.fill(0);
                  if (cur === 0) ds.offset[index] = 20;
                  chart.update();
                }
              }
            });
            renderCustomLegend(labels, values, colors);
            console.log('✅ Category chart created successfully');
            
            // Force resize to ensure correct dimensions
            setTimeout(() => {
              if (window.categoryBreakdownChart) {
                window.categoryBreakdownChart.resize();
              }
            }, 50);
          } catch (e) {
            console.error('❌ Error creating category chart:', e);
          }
        }, 150);
      }

      function init(){
        console.log('🚀 Initializing charts...');
  var selectedYear = {{ selected_year | tojson | safe }}
  var chartTimeRange = {{ chart_time_range | tojson | safe }}
  var multiYearData = {{ multi_year_data | tojson | safe }}
  var yearRange = {{ year_range | tojson | safe }}
  var categoryLabels = {{ data.category_data.keys() | list | tojson | safe }}
  var categoryValues = {{ data.category_data.values() | list | tojson | safe }}
        console.log('📊 Selected Year:', selectedYear);
        console.log('🍩 Category Data:', {labels: categoryLabels, values: categoryValues});
        
        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const shortMonths = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
        const colors = ['#4f46e5','#10b981','#f97316','#3b82f6','#ec4899','#8b5cf6','#f59e0b','#ef4444'];
        
        // Prepare chart data based on time range
        let labels, datasets;
        
        if (chartTimeRange === '1Y') {
          // Show single year with 12 months
          const currentYearData = multiYearData[selectedYear] || {};
          const prevYearData = multiYearData[selectedYear - 1] || {};
          
          labels = shortMonths;
          datasets = [
            {
              label: `${selectedYear - 1}`,
              data: months.map(m => prevYearData[m] || 0),
              backgroundColor: 'rgba(59,130,246,0.3)',
              hoverBackgroundColor: 'rgba(20,184,166,0.3)',
              borderRadius: 6,
              borderSkipped: false,
              barPercentage: 0.6,
              categoryPercentage: 0.7
            },
            {
              label: `${selectedYear}`,
              data: months.map(m => currentYearData[m] || 0),
              backgroundColor: '#3b82f6',
              hoverBackgroundColor: '#14b8a6',
              borderRadius: 6,
              borderSkipped: false,
              barPercentage: 0.6,
              categoryPercentage: 0.7
            }
          ];
        } else {
          // Show multiple years (aggregate by year)
          labels = yearRange.map(y => y.toString());
          const yearlyTotals = yearRange.map(year => {
            const yearData = multiYearData[year] || {};
            return months.reduce((sum, month) => sum + (yearData[month] || 0), 0);
          });
          
          datasets = [
            {
              label: 'Total Emissions (tonCO₂e)',
              data: yearlyTotals,
              backgroundColor: colors.slice(0, yearRange.length),
              hoverBackgroundColor: colors.slice(0, yearRange.length).map(c => c + 'CC'),
              borderRadius: 6,
              borderSkipped: false,
              barPercentage: 0.7,
              categoryPercentage: 0.8
            }
          ];
        }
        
        renderEmissionsOverTimeChartNew(labels, datasets, selectedYear);
        renderCategoryBreakdownChart(categoryLabels, categoryValues, colors);
      }
      
      function renderEmissionsOverTimeChartNew(labels, datasets, selectedYear) {
        console.log('📊 Creating Emissions Over Time Chart (Multi-year support)...');
        
        setTimeout(() => {
          const canvas = document.getElementById('emissionsOverTimeChart');
          if (!canvas) {
            console.error('Canvas not found!');
            return;
          }
          
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            console.error('Context not available!');
            return;
          }
          
          try {
            window.emissionsOverTimeChart = new Chart(ctx, {
              type: 'bar',
              data: { labels, datasets },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: {
                  duration: 900,
                  easing: 'easeOutQuart'
                },
                plugins: {
                  legend: { display: true },
                  tooltip: {
                    callbacks: {
                      label: (c) => ` ${c.dataset.label}: ${c.raw.toFixed(1)} tonCO₂e`
                    },
                    displayColors: true,
                    padding: 10,
                    backgroundColor: '#1f2937'
                  }
                },
                scales: {
                  x: { grid: { display: false }, ticks: { color: '#6b7280' } },
                  y: { 
                    beginAtZero: true, 
                    grid: { color: 'rgba(0,0,0,0.05)', drawBorder: false }, 
                    ticks: { color: '#6b7280' }
                  }
                }
              }
            });
            console.log('✅ Emissions chart created successfully');
            
            // Force resize to ensure correct dimensions
            setTimeout(() => {
              if (window.emissionsOverTimeChart) {
                window.emissionsOverTimeChart.resize();
              }
            }, 50);
          } catch (e) {
            console.error('❌ Error creating emissions chart:', e);
          }
        }, 100);
      }
      
      // Wait for DOM to be completely ready
      setTimeout(init, 500);
    })();
  </script>
</div>
