{% for campus in campuses %}
<li onclick="event.stopPropagation();">
  <label class="label cursor-pointer justify-start w-full p-2 hover:bg-base-200" 
         onclick="event.stopPropagation();">
    <input type="radio" class="radio radio-sm mr-2" 
           name="selected_campus" value="{{ campus.id }}"
           {% if campus.id == current_user.campus_id %}checked{% endif %}
           hx-post="/summary/departments" 
           hx-target="#department-list"
           hx-vals='{"campus_name": "{{ campus.name["0"] }}"}'
           hx-trigger="change"
           onclick="event.stopPropagation();">
    <span class="label-text" onclick="event.stopPropagation();">{{ campus.name["0"] }}</span>
  </label>
</li>
{% endfor %}

<!-- Reset ทุกอย่างเมื่อ campus เปลี่ยน -->
<div hx-get="/summary/reset-display" 
     hx-target="#stats-container"
     hx-trigger="change from:[name='selected_campus']">
</div>

<div hx-get="/summary/reset-display" 
     hx-target="#charts-container"
     hx-trigger="change from:[name='selected_campus']">
</div>

<div hx-post="/summary/scopes" 
     hx-target="#scope-list"
     hx-include="[name='selected_campus']:checked, [name='selected_department']:checked"
     hx-trigger="change from:[name='selected_campus']">
</div>

<div hx-post="/summary/years" 
     hx-target="#year-list"
     hx-include="[name='selected_campus']:checked, [name='selected_department']:checked"
     hx-trigger="change from:[name='selected_campus']">
</div>

<!-- Reset sub scope list -->
<div hx-swap-oob="innerHTML:#sub-scope-list" 
     hx-trigger="change from:[name='selected_campus']">
  <li><span class="text-gray-500 p-2 text-sm">Select Scope first</span></li>
</div>
