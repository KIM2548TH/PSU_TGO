{% for scope in scopes %}
<li>
  <label class="flex items-center cursor-pointer p-2 hover:bg-gray-100">
    <input type="checkbox" 
           name="selected_scopes" 
           value="{{ scope.ghg_scope }}" 
           class="checkbox checkbox-primary checkbox-sm mr-2"
           {% if scope.ghg_scope|string in session.get('selected_scopes', []) %}checked{% endif %}
           hx-post="/summary/update-scope-selection" 
           hx-trigger="change"
           hx-include="[name='selected_scopes']:checked"
           hx-swap="none">
    <span class="flex-1">Scope {{ scope.ghg_scope }}</span>
  </label>
</li>
{% endfor %}

<!-- Hidden triggers ที่จะทำงานเมื่อ scope เปลี่ยน -->
<div style="display: none;">
  <div hx-get="/summary/update-badges"
       hx-target="#active-filters"
       hx-trigger="change from:[name='selected_scopes'] delay:100ms"
       hx-sync="body:queue last"
       hx-swap="outerHTML"></div>

  <div hx-post="/summary/stats"
       hx-target="#stats-container"
       hx-include="[name='time_period']:checked, [name='selected_year']:checked, [name='selected_sub_scopes']:checked, [name='selected_scopes']:checked"
       hx-trigger="change from:[name='selected_scopes'] delay:200ms"
       hx-sync="body:queue last"
       hx-swap="outerHTML"></div>

  <div hx-post="/summary/charts"
       hx-target="#charts-container"
       hx-include="[name='time_period']:checked, [name='selected_year']:checked, [name='selected_sub_scopes']:checked, [name='selected_scopes']:checked"
       hx-trigger="change from:[name='selected_scopes'] delay:300ms"
       hx-sync="body:queue last"
       hx-swap="outerHTML"></div>
</div>
