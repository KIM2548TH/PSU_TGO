{% for year in years %}
<li>
  <label class="flex items-center cursor-pointer p-2 hover:bg-gray-100">
    <input type="radio" 
           name="selected_year" 
           value="{{ year }}" 
           class="radio radio-primary radio-sm mr-2"
           {% if year == selected_year %}checked{% endif %}
           hx-post="/summary/stats" 
           hx-target="#stats-container" 
           hx-include="[name='time_period']:checked, [name='selected_sub_scopes']:checked, [name='selected_scopes']:checked"
           hx-trigger="change"
           hx-swap="outerHTML"
           onchange="
             document.getElementById('hidden-selected-year').value = this.value;
             document.getElementById('year-display').textContent = this.value;
             setTimeout(function() {
               htmx.ajax('POST', '/summary/charts', {
                 target: '#charts-container',
                 swap: 'outerHTML',
                 values: {
                   'selected_year': document.getElementById('hidden-selected-year').value,
                   'time_period': document.querySelector('[name=\'time_period\']:checked')?.value || 'week',
                   'chart_time_range': '1Y'
                 }
               });
               
               // Trigger Top Materials reload
               var selectedScope = document.querySelector('[name=\'selected_scope\']:checked')?.value || 'all';
               var yearValue = document.getElementById('hidden-selected-year').value;
               htmx.ajax('GET', '/summary/partials/top_sub_scope?selected_scope=' + selectedScope + '&selected_year=' + yearValue, {
                 target: '#top-sub-scope-content',
                 swap: 'innerHTML'
               });
             }, 200);
           ">
    <span class="flex-1">{{ year }}</span>
  </label>
</li>
{% endfor %}
