{% from "components/toast-notification.html" import success_toast, error_toast %}

<div class="max-w-6xl mx-auto px-6 py-8">
  <!-- ปุ่มปิดป็อปอัพ -->
  <div class="flex justify-end mb-4">
    <button type="button" 
            class="btn btn-sm btn-ghost text-gray-700 hover:text-gray-900 hover:bg-gray-100" 
            onclick="document.getElementById('modal').classList.remove('modal-open')"
            title="ปิดป็อปอัพ">
      <i data-feather="x" class="h-5 w-5 mr-1"></i>
      ปิด
    </button>
  </div>

  <!-- Main container -->
  <div class="flex justify-center">
    <!-- Left: Create Form Field -->
    <div class="bg-white rounded-[7px] border border-gray-300 shadow-md p-6">
      <div class="flex justify-between items-center mb-4">
        <h3 class="text-black-600 font-bold text-lg border-b border-b-gray-200 pb-3">สร้างฟอร์ม</h3>
      </div>
      
      <form method="POST" 
            hx-post="{{ url_for('form_management.add_form_and_formula') }}"
            hx-target="#modal-content"
            hx-swap="innerHTML">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token else '' }}"/>
        <input type="hidden" name="is_linked" value="false"/>
        
        <!-- Form Metadata -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label class="text-font">ชื่อวัสดุ</label>
            <input type="text" name="material_name" 
                   class="input input-bordered w-full mt-1" 
                   placeholder="กรอกชื่อวัสดุ"
                   required>
          </div>

          <!-- Main Scope -->
          <div>
            <label class="text-font">Main Scope</label>
            <select name="scope" class="select select-bordered w-full mt-1"
                    hx-get="/form-management/get-sub-scopes/{{ default_scope or '' }}"
                    hx-target="#sub-scope-container"
                    hx-trigger="change"
                    hx-include="this"
                    required
                    onchange="this.setAttribute('hx-get', '/form-management/get-sub-scopes/' + this.value)">
              <option value="">เลือก Main Scope</option>
              <option value="1" {% if default_scope == 1 %}selected{% endif %}>Scope 1</option>
              <option value="2" {% if default_scope == 2 %}selected{% endif %}>Scope 2</option>
              <option value="3" {% if default_scope == 3 %}selected{% endif %}>Scope 3</option>
            </select>
          </div>

          <!-- Sub Scope -->
          <div>
            <label class="text-font">Sub Scope</label>
            <div id="sub-scope-container">
              {% if default_scope %}
                <div hx-get="/form-management/get-sub-scopes/{{ default_scope }}{% if default_sub_scope %}?selected={{ default_sub_scope }}{% endif %}"
                     hx-trigger="load"
                     hx-target="this"
                     hx-swap="outerHTML">
                  <select name="sup_scope" class="select select-bordered w-full mt-1" required>
                    <option value="">กำลังโหลด...</option>
                  </select>
                </div>
              {% else %}
                <select name="sup_scope" class="select select-bordered w-full mt-1" required>
                  <option value="">กรุณาเลือก Main Scope ก่อน</option>
                </select>
              {% endif %}
            </div>
          </div>

          <div class="sm:col-span-2">
            <label class="text-font">คำอธิบายฟอร์ม</label>
            <textarea name="desc_form" 
                      class="textarea textarea-bordered w-full mt-1" 
                      placeholder="กรอกคำอธิบายฟอร์ม"></textarea>
          </div>
        </div>

        <!-- Form Type Toggle -->
        <div class="mt-6">
          <label class="text-font">ประเภทฟอร์ม</label>
          <div class="mt-2">
            <label class="flex items-center gap-3 cursor-pointer">
              <input type="radio" name="form_type" value="normal" class="radio radio-primary" checked
                     hx-post="/form-management/form-builder/toggle-form-type"
                     hx-target="#form-fields-container"
                     hx-trigger="change"
                     hx-include="closest form">
              <span>ฟอร์มปกติ</span>
            </label>
            <label class="flex items-center gap-3 cursor-pointer mt-2">
              <input type="radio" name="form_type" value="linked" class="radio radio-primary"
                     hx-post="/form-management/form-builder/toggle-form-type"
                     hx-target="#form-fields-container"
                     hx-trigger="change"
                     hx-include="closest form">
              <span>ฟอร์มลิงก์</span>
            </label>
          </div>
        </div>

        <!-- Dynamic Form Fields Container -->
        <div id="form-fields-container" class="mt-6">
          {% include "form-management/partials/normal-form-section.html" %}
        </div>

        <!-- Card แจ้งเตือนเรื่องสูตรคำนวณ -->
        <div class="mt-6">
          <div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 rounded shadow flex items-center gap-3">
            <i data-feather="info" class="w-5 h-5 text-yellow-400"></i>
            <div>
              <span class="font-semibold text-yellow-700">หมายเหตุ:</span>
              <span class="text-yellow-700">คุณสามารถเพิ่มหรือแก้ไขสูตรคำนวณได้หลังจากสร้างฟอร์มเรียบร้อยแล้ว</span>
            </div>
          </div>
        </div>


        <!-- Submit Button -->
        <div class="mt-6 flex justify-end gap-3">
          <button type="button" 
                  class="btn btn-ghost"
                  onclick="document.getElementById('modal').classList.remove('modal-open')">
            ยกเลิก
          </button>
          <button type="submit" class="btn btn-primary">
            บันทึกฟอร์ม
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<style>
/* CSS สำหรับ calculator toggle */
/* ซ่อน calculator เมื่อ checkbox ไม่ถูก check */
#calculator-toggle:not(:checked) ~ div .calculator-container {
    display: none !important;
}

/* แสดง calculator เมื่อ checkbox ถูก check */
#calculator-toggle:checked ~ div .calculator-container {
    display: block !important;
}

/* ซ่อน calculator container เมื่อว่างเปล่า และลบ margin */
.calculator-container:empty {
    display: none !important;
    margin: 0 !important;
    padding: 0 !important;
    height: 0 !important;
    min-height: 0 !important;
}
</style>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Handle form type toggle
    const formTypeRadios = document.querySelectorAll('input[name="form_type"]');
    const isLinkedHidden = document.querySelector('input[name="is_linked"]');
    
    formTypeRadios.forEach(radio => {
        radio.addEventListener('change', function() {
            if (isLinkedHidden) {
                isLinkedHidden.value = this.value === 'linked' ? 'true' : 'false';
            }
        });
    });
    
    // Function สำหรับอัปเดต field counter
    function updateFieldCounter() {
        const container = document.getElementById('input-fields-container');
        const addButton = document.querySelector('button[hx-post*="add-input-field"]');
        
        if (container && addButton) {
            const fieldCount = container.querySelectorAll('[data-index^="input-"]').length;
            addButton.setAttribute('hx-vals', JSON.stringify({field_index: fieldCount}));
        }
    }
    
    // Make functions global
    window.updateFieldCounter = updateFieldCounter;
});
</script>
