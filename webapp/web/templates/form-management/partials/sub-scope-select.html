<select name="sup_scope" id="sub-scope" class="select select-bordered w-full mt-1" 
        hx-post="/form-management/form-builder/preview"
        hx-target="#preview-content"
        hx-trigger="change"
        hx-include="closest form"
        required>
  {% if sub_scopes %}
    <option value="">เลือก Sub Scope</option>
    {% for scope in sub_scopes %}
      <option value="{{ scope.ghg_sup_scope }}" 
              {{ 'selected' if selected_value == scope.ghg_sup_scope else '' }}>
        {{ scope.ghg_sup_scope }} - {{ scope.ghg_name }}
      </option>
    {% endfor %}
  {% else %}
    <option value="">ไม่พบ Sub Scope</option>
  {% endif %}
</select>
