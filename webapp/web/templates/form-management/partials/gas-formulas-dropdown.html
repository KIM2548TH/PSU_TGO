<!-- Gas Formulas Section - Inside Formula Card -->
<div class="border-t border-gray-200 border-dashed">
  <div class="flex items-center justify-between py-2">
    <button type="button" 
            class="flex items-center gap-2 text-sm font-medium text-blue-600 hover:text-blue-700 transition-colors"
            onclick="toggleGasFormulas('{{ form.id }}')">
      <i data-feather="wind" class="w-4 h-4"></i>
      <span>สูตรคำนวณก๊าซ (7 ชนิด)</span>
      <i data-feather="chevron-down" class="w-4 h-4 transition-transform" id="chevron-{{ form.id }}"></i>
    </button>
    
    <div class="flex items-center gap-2">
      {% if has_permission("แก้ไขฟอร์ม") %}
      <button type="button" class="text-blue-500 hover:text-blue-700 p-1 rounded-md hover:bg-blue-50 transition-colors" 
              title="แก้ไขสูตรคำนวณก๊าซ"
              hx-get="{{ url_for('gas_formula.load_gas_formula_editor', form_id=form.id) }}"
              hx-target="#modal-content"
              hx-swap="innerHTML"
              hx-on:htmx:after-request="document.getElementById('modal').classList.add('modal-open')">
              <i data-feather="wind" class="w-4 h-4"></i>
      </button>
      <button type="button" class="text-cyan-500 hover:text-cyan-700 p-1 rounded-md hover:bg-cyan-50 transition-colors" 
              title="รีเฟรชคำนวณก๊าซ"
              hx-post="{{ url_for('gas_formula.refresh_gas_calculations', form_id=form.id) }}"
              hx-confirm="ต้องการรีเฟรชคำนวณก๊าซทั้งหมดหรือไม่?"
              hx-indicator="#loading-spinner">
        <i data-feather="activity" class="w-4 h-4"></i>
      </button>
      {% endif %}
      <div id="loading-spinner-{{ form.id }}" class="htmx-indicator hidden">
        <div class="animate-spin rounded-full h-4 w-4 border-b-2 border-blue-600"></div>
      </div>
    </div>
  </div>
  
  <!-- Gas Formulas Content - จะถูกโหลดด้วย JavaScript -->
  <div id="gas-formulas-content-{{ form.id }}" class="hidden relative bg-gray-50">
    <!-- Content will be loaded here -->
  </div>
</div>

<script>
function toggleGasFormulas(formId) {
  const content = document.getElementById('gas-formulas-content-' + formId);
  const chevron = document.getElementById('chevron-' + formId);
  const spinner = document.getElementById('loading-spinner-' + formId);
  
  if (content.classList.contains('hidden')) {
    // Show loading
    spinner.classList.remove('hidden');
    
    // Load data via fetch
    fetch('/form-management/gas-formulas/' + formId)
      .then(response => response.text())
      .then(html => {
        content.innerHTML = html;
        content.classList.remove('hidden');
        chevron.classList.add('chevron-rotated');
        spinner.classList.add('hidden');
        
        // Re-initialize feather icons
        if (typeof feather !== 'undefined') {
          feather.replace();
        }
      })
      .catch(error => {
        console.error('Error loading gas formulas:', error);
        content.innerHTML = '<div class="text-center py-2 text-red-500"><i data-feather="alert-circle" class="w-3 h-3 inline mr-1"></i>เกิดข้อผิดพลาดในการโหลดข้อมูล</div>';
        content.classList.remove('hidden');
        spinner.classList.add('hidden');
        
        // Re-initialize feather icons
        if (typeof feather !== 'undefined') {
          feather.replace();
        }
      });
  } else {
    // Hide content
    content.classList.add('hidden');
    chevron.classList.remove('chevron-rotated');
  }
}
</script>

<style>
  /* เพิ่ม z-index สูงเพื่อแสดงทับ element อื่น */
  .card {
    overflow: visible; /* ให้ dropdown แสดงทับได้ */
  }
  
  /* Animation for chevron */
  .chevron-rotated {
    transform: rotate(180deg);
  }
</style>

<script>
  // Toggle chevron rotation when dropdown is shown/hidden
  document.addEventListener('htmx:afterRequest', function(event) {
    const target = event.target;
    if (target.id && target.id.startsWith('gas-formulas-content-')) {
      const formId = target.id.replace('gas-formulas-content-', '');
      const chevron = document.getElementById('chevron-' + formId);
      const content = document.getElementById('gas-formulas-content-' + formId);
      
      if (content && !content.classList.contains('hidden')) {
        chevron.classList.add('chevron-rotated');
      } else {
        chevron.classList.remove('chevron-rotated');
      }
    }
  });
</script>
