<div class="calculator-container bg-white border border-gray-200 rounded-lg shadow-lg p-4 mt-3">
  <div class="flex justify-between items-center mb-3">
    <h4 class="text-sm font-semibold text-gray-700">เครื่องคิดเลขสูตร tonCO₂e</h4>
    <button type="button" class="btn btn-ghost btn-xs text-gray-500 hover:text-gray-700"
            hx-post="/gas-formula/calculator/hide-conversion2"
            hx-target="closest .calculator-container"
            hx-swap="outerHTML">
      <i data-feather="x" class="w-4 h-4"></i>
    </button>
  </div>
  
  <!-- ตัวแปร -->
  <div class="mb-3">
    <p class="text-xs font-medium text-gray-600 mb-2">ตัวแปรที่ใช้ได้:</p>
    <div class="flex flex-wrap gap-1">
      {% for var in variables %}
      <button type="button" 
              class="btn btn-xs bg-blue-100 text-blue-800 hover:bg-blue-200"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "{{ var.field }}", "calculator_type": "{{ calculator_type }}"}'>
        {{ var.field }}
      </button>
      {% endfor %}
      <!-- เพิ่มตัวแปร result สำหรับสูตรที่ 2 -->
      <button type="button" 
              class="btn btn-xs bg-green-100 text-green-800 hover:bg-green-200"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "result", "calculator_type": "{{ calculator_type }}"}'>
        result
      </button>
    </div>
  </div>
  
  <!-- ตัวดำเนินการ -->
  <div class="mb-3">
    <p class="text-xs font-medium text-gray-600 mb-2">ตัวดำเนินการ:</p>
    <div class="grid grid-cols-4 gap-2">
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "+", "calculator_type": "{{ calculator_type }}"}'>+</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "-", "calculator_type": "{{ calculator_type }}"}'>-</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "*", "calculator_type": "{{ calculator_type }}"}'>×</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "/", "calculator_type": "{{ calculator_type }}"}'>÷</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "(", "calculator_type": "{{ calculator_type }}"}'>(</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": ")", "calculator_type": "{{ calculator_type }}"}'>)</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": ".", "calculator_type": "{{ calculator_type }}"}'>.</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": " ", "calculator_type": "{{ calculator_type }}"}'>Space</button>
    </div>
  </div>
  
  <!-- ตัวเลข -->
  <div class="mb-3">
    <p class="text-xs font-medium text-gray-600 mb-2">ตัวเลข:</p>
    <div class="grid grid-cols-5 gap-1">
      {% for num in range(1, 10) %}
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "{{ num }}", "calculator_type": "{{ calculator_type }}"}'>{{ num }}</button>
      {% endfor %}
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "0", "calculator_type": "{{ calculator_type }}"}'>0</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": "00", "calculator_type": "{{ calculator_type }}"}'>00</button>
      <button type="button" 
              class="btn btn-xs btn-outline"
              hx-post="/gas-formula/calculator/add-value-conversion2"
              hx-target="#conversion2-formula-input"
              hx-swap="outerHTML"
              hx-include="closest form"
              hx-vals='{"value": ".", "calculator_type": "{{ calculator_type }}"}'>.</button>
    </div>
  </div>
  
  <!-- ปุ่มควบคุม -->
  <div class="flex gap-2">
    <button type="button" 
            class="btn btn-sm btn-outline flex-1"
            hx-post="/gas-formula/calculator/remove-last-conversion2"
            hx-target="#conversion2-formula-input"
            hx-swap="outerHTML"
            hx-include="closest form"
            hx-vals='{"calculator_type": "{{ calculator_type }}"}'>
      <i data-feather="delete" class="w-4 h-4"></i> ลบ
    </button>
    <button type="button" 
            class="btn btn-sm btn-error flex-1"
            hx-post="/gas-formula/calculator/clear-conversion2"
            hx-target="#conversion2-formula-input"
            hx-swap="outerHTML"
            hx-include="closest form"
            hx-vals='{"calculator_type": "{{ calculator_type }}"}'>
      <i data-feather="trash-2" class="w-4 h-4"></i> ล้าง
    </button>
  </div>
</div>

<script>
// Initialize feather icons immediately and also after HTMX content loads
function initializeFeatherIcons() {
    if (typeof feather !== 'undefined') {
        feather.replace();
    }
}

// Initialize on page load
document.addEventListener('DOMContentLoaded', initializeFeatherIcons);

// Also initialize after HTMX swaps content
document.addEventListener('htmx:afterSwap', initializeFeatherIcons);

// Initialize after a short delay to ensure all content is loaded
setTimeout(initializeFeatherIcons, 100);
</script>
