<!-- Linked Form Section -->
<div class="space-y-4">
    <div>
        <h3 class="text-lg font-semibold text-gray-800 mb-3">เลือก Material ที่จะลิงก์</h3>
        
        <div id="material-select-container"
             hx-get="/form-management/get-available-materials"
             hx-trigger="load"
             hx-target="this"
             hx-swap="innerHTML">
            <select name="linked_material_name" class="select select-bordered w-full" required>
                <option value="">กำลังโหลด...</option>
            </select>
        </div>
    </div>
    
    <div id="linked-fields-preview" class="bg-yellow-50 border border-yellow-200 rounded-lg p-4">
        <div class="text-center text-gray-500">
            <i data-feather="link" class="w-8 h-8 mx-auto mb-2 text-gray-300"></i>
            <p>เลือก Material เพื่อดูฟิลด์ที่จะถูกลิงก์</p>
        </div>
    </div>
    
    <div class="text-sm text-gray-500 bg-yellow-50 p-3 rounded-lg">
        <i data-feather="info" class="inline w-4 h-4 mr-1"></i>
        ฟอร์มลิงก์จะใช้ฟิลด์เดียวกันกับ Material ที่เลือก และจะดึงข้อมูลจากระบบโดยอัตโนมัติ
    </div>
    
    <!-- Hidden field สำหรับระบุว่าเป็น linked form -->
    <input type="hidden" name="is_linked" value="true">
</div>
