<!-- Linked Form Section -->
<div class="space-y-4">
  <div class="alert bg-blue-50 border border-blue-300 text-blue-800">
    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6 text-blue-600" fill="none" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <div>
      <h3 class="font-bold text-blue-800">ฟอร์มลิงก์</h3>
      <div class="text-sm mt-2">
        เลือก Material ที่ต้องการเชื่อมโยง ระบบจะใช้ input fields จาก Material นั้นโดยอัตโนมัติ
      </div>
    </div>
  </div>

  <div>
    <label class="text-font">เลือก Material ที่ต้องการเชื่อมโยง</label>
    <select name="linked_material_name" class="select select-bordered w-full mt-1"
            hx-get="/form-management/form-builder/load-linked-fields"
            hx-target="#linked-fields-preview"
            hx-trigger="change"
            hx-include="this"
            required>
      <option value="">เลือก Material</option>
      {% for material in materials %}
        <option value="{{ material.material_name }}">
          {{ material.material_name }} (Scope {{ material.ghg_scope }}.{{ material.ghg_sup_scope }})
        </option>
      {% endfor %}
    </select>
  </div>

  <!-- แสดงฟิลด์ที่จะถูกสร้างอัตโนมัติ -->
  <div class="mt-4 p-4 bg-gray-50 border border-gray-200 rounded-lg">
    <h4 class="text-sm font-medium text-gray-800 mb-3">ฟิลด์ที่สร้างอัตโนมัติ</h4>
    <div id="linked-fields-preview">
      <div class="text-center text-gray-500">กรุณาเลือก Material</div>
    </div>
  </div>
</div>

<script>
// อัปเดต hidden field เมื่อเปลี่ยน form type
document.addEventListener('DOMContentLoaded', function() {
  const isLinkedInput = document.querySelector('input[name="is_linked"]');
  if (isLinkedInput) {
    isLinkedInput.value = 'true';
  }
});
</script>
