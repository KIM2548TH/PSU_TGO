<div id="calculator-dropdown-container" class="bg-white border border-gray-300 rounded-lg shadow-lg p-4 mt-2 calculator-dropdown">
  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <h4 class="text-sm font-semibold text-gray-700">Formula Calculator</h4>
    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/hide"
            hx-target="closest #calculator-dropdown-container"
            hx-swap="delete">
      <i data-feather="x" class="w-4 h-4"></i>
    </button>
  </div>

  <!-- Variables Section -->
  <div class="mb-4">
    <h5 class="text-xs font-medium text-gray-600 mb-2">Variables</h5>
    <div class="grid grid-cols-2 gap-2">
      {% for variable in variables %}
        <button type="button" 
                class="btn btn-sm btn-outline text-xs {{ variable.color }}"
                hx-post="/form-management/calculator/add-value"
                hx-target="#formula"
                hx-swap="outerHTML"
                hx-vals='{"value": "{{ variable.field }}"}'
                hx-include="#formula">
          {{ variable.field }}
          <br><span class="text-xs opacity-70">{{ variable.label }}</span>
        </button>
      {% endfor %}
    </div>
  </div>

  <!-- Numbers & Operators -->
  <div class="grid grid-cols-4 gap-2 mb-3">
    <!-- Numbers -->
    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "1"}'
            hx-include="#formula">1</button>
    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "2"}'
            hx-include="#formula">2</button>
    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "3"}'
            hx-include="#formula">3</button>
    <button type="button" class="btn btn-sm btn-outline"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": " + "}'
            hx-include="#formula">+</button>

    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "4"}'
            hx-include="#formula">4</button>
    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "5"}'
            hx-include="#formula">5</button>
    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "6"}'
            hx-include="#formula">6</button>
    <button type="button" class="btn btn-sm btn-outline"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": " - "}'
            hx-include="#formula">-</button>

    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "7"}'
            hx-include="#formula">7</button>
    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "8"}'
            hx-include="#formula">8</button>
    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "9"}'
            hx-include="#formula">9</button>
    <button type="button" class="btn btn-sm btn-outline"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": " * "}'
            hx-include="#formula">×</button>

    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "("}'
            hx-include="#formula">(</button>

    <button type="button" class="btn btn-sm btn-ghost"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "0"}'
            hx-include="#formula">0</button>

   <button type="button" class="btn btn-sm btn-ghost flex-1"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": ")"}'
            hx-include="#formula">)</button>

            
    <button type="button" class="btn btn-sm btn-outline"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": " / "}'
            hx-include="#formula">÷</button>
  </div>

  <!-- Action Buttons -->
  <div class="flex gap-2">
    <button type="button" class="btn btn-sm btn-ghost flex-1"
            hx-post="/form-management/calculator/add-value"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-vals='{"value": "."}'
            hx-include="#formula">.</button>
    <button type="button" class="btn btn-sm btn-warning flex-1"
            hx-post="/form-management/calculator/remove-last"
            hx-target="#formula"
            hx-swap="outerHTML"
            hx-include="#formula">⌫</button>
    <button type="button" class="btn btn-sm btn-error flex-1"
            hx-post="/form-management/calculator/clear"
            hx-target="#formula"
            hx-swap="outerHTML">Clear</button>
  </div>
</div>
