<div class="border border-gray-300 rounded-xl p-4 bg-gray-50 shadow-sm" data-index="input-{{ field_index }}">
  <div class="flex justify-between items-center mb-3">
    <h4 class="text-md font-semibold text-gray-600">Field #{{ field_number }}</h4>
    <button type="button" class="btn btn-sm btn-error"
            hx-delete="/form-management/form-builder/remove-input-field"
            hx-target="closest [data-index]"
            hx-swap="delete"
            hx-confirm="ต้องการลบฟิลด์นี้หรือไม่?"
            onclick="updateFieldCounter()">
      ✕
    </button>
  </div>
  
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
    <div>
      <label class="text-sm text-gray-600">Field Name</label>
      <input name="{% if is_linked_form %}custom_field{% else %}field{% endif %}" class="input input-bordered w-full mt-1" 
             placeholder="field_name" 
             required>
    </div>
    
    <div>
      <label class="text-sm text-gray-600">Label</label>
      <input name="{% if is_linked_form %}custom_label{% else %}label{% endif %}" class="input input-bordered w-full mt-1" 
             placeholder="Display Label"
             required>
    </div>
    
    <div>
      <label class="text-sm text-gray-600">Input Type</label>
      <select name="{% if is_linked_form %}custom_input_type{% else %}input_type{% endif %}" class="select select-bordered w-full mt-1">
        <option value="number">Number</option>
        <option value="text">Text</option>
        <option value="select">Select</option>
      </select>
    </div>
    
    <div>
      <label class="text-sm text-gray-600">Unit</label>
      <input name="{% if is_linked_form %}custom_unit{% else %}unit{% endif %}" class="input input-bordered w-full mt-1" 
             placeholder="kg, liter, etc.">
    </div>
  </div>
</div>
